[tool.poetry]
name = "work-history"
version = "0.1.0"
description = "Collect work activity from Git, Slack, Jira, Confluence and generate an AI prompt"
authors = ["work-history"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
httpx = "^0.27.0"
jinja2 = "^3.1.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
respx = "^0.21.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
